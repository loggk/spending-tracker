name: CI

# Pushes to main are verified by the deploy workflow instead, so a merge does
# not run the same checks twice.
on:
  pull_request:

# A newer push to the same branch makes an in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
